        'ids-knowledgebase/idsa-rulebook/functional-requirements/140_decentralized_patterns_onboarding': 'external/rulebook/140_Decentralized_Patterns_Onboarding.md'
        'ids-knowledgebase/idsa-rulebook/summary/999_summary_outlook': 'external/rulebook/999_Summary_Outlook.md'
        'ids-knowledgebase/idsa-rulebook/imprint-and-external-links/frontmatter': 'external/rulebook/FrontMatter.md'
        # ── RAM 5 ─────────────────────────────────────────────────────
        'ids-knowledgebase/ids-ram-5-working-draft': 'external/ram/Introduction.md'
        'ids-knowledgebase/ids-ram-5-working-draft/docs/introduction': 'external/ram/Introduction.md'
        'ids-knowledgebase/ids-ram-5-working-draft/docs/context': 'external/ram/Context.md'
