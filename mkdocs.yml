        # ── Manifesto ─────────────────────────────────────────────────
        'ids-knowledgebase/manifesto-for-international-dataspaces.md': 'external/manifesto/manifesto.md'
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - footnotes
  - def_list
extra:
  generator: false
