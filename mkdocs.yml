        'ids-knowledgebase/idsa-rulebook/functional-requirements/124_processingservices.md': 'external/rulebook/124_ProcessingServices.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/125_connector.md': 'external/rulebook/125_Connector.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/130_ai_agents.md': 'external/rulebook/130_AI_Agents.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/140_decentralized_patterns_onboarding.md': 'external/rulebook/140_Decentralized_Patterns_Onboarding.md'
