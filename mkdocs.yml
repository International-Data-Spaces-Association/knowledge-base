
site_name: IDSA Knowledge Base
site_url: https://kb.internationaldataspaces.org
theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/IDSA-logo_2.png
  custom_dir: overrides
  static_templates:
    - 404.html
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - content.code.copy
  palette:
    primary: custom
    accent: custom
extra_css:
  - assets/styles.css
plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      exclude:
        - external/**/*
  - literate-nav:
      nav_file: SUMMARY.md
  - redirects:
      redirect_maps:
        # ── kb root ──────────────────────────────────────────────────
        'ids-knowledgebase.md': 'index.md'
        # ── Rulebook ──────────────────────────────────────────────────
        'ids-knowledgebase/idsa-rulebook.md': 'external/rulebook/001_Introduction.md'
        'ids-knowledgebase/v/idsa-rulebook': 'external/rulebook/001_Introduction.md'
        'ids-knowledgebase/idsa-rulebook/fundamentals/002_guidingprinciples.md': 'external/rulebook/002_GuidingPrinciples.md'
        'ids-knowledgebase/idsa-rulebook/fundamentals/003_whatisadataspace.md': 'external/rulebook/003_WhatIsADataspace.md'
        'ids-knowledgebase/idsa-rulebook/fundamentals/004_layers.md': 'external/rulebook/004_Layers.md'
        'ids-knowledgebase/idsa-rulebook/fundamentals/005_roles.md': 'external/rulebook/005_Roles.md'
        'ids-knowledgebase/idsa-rulebook/fundamentals/006_dsga.md': 'external/rulebook/006_DSGA.md'
        'ids-knowledgebase/idsa-rulebook/fundamentals/007_decentralization.md': 'external/rulebook/007_Decentralization.md'
        'ids-knowledgebase/idsa-rulebook/fundamentals/008_trust.md': 'external/rulebook/008_Trust.md'
        'ids-knowledgebase/idsa-rulebook/fundamentals/009_dataspace_trust_frameworks.md': 'external/rulebook/009_Dataspace_Trust_Frameworks.md'
        'ids-knowledgebase/idsa-rulebook/fundamentals/010_planes.md': 'external/rulebook/010_Planes.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/100_functional_requirements.md': 'external/rulebook/100_Functional_Requirements.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/101_achieving_autonomy_and_agency.md': 'external/rulebook/101_Achieving_Autonomy_and_Agency.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/102_foundational_concepts_of_a_data_space.md': 'external/rulebook/102_Foundational_concepts_of_a_data_space.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/103_establishing_trust.md': 'external/rulebook/103_Establishing_Trust.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/104_attributes_and_claims.md': 'external/rulebook/104_Attributes_and_claims.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/105_policies.md': 'external/rulebook/105_Policies.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/106_dataspace_membership.md': 'external/rulebook/106_Dataspace_Membership.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/107_identity.md': 'external/rulebook/107_Identity.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/108_data_space_participation.md': 'external/rulebook/108_Data_space_participation.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/110_data_sharing.md': 'external/rulebook/110_Data_sharing.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/114_creating_a_data_space.md': 'external/rulebook/114_Creating_a_data_space.md'
        'ids-knowledgebase/idsa-rulebook/functional-requirements/115_interoperability_in_data_spaces.md': 'external/rulebook/115_Interoperability_in_data_spaces.md'
