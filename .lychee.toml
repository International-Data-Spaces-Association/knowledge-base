# Lychee link checker configuration
exclude = [
  "mailto:security@your-org.example",
  "mailto:privacy@your-org.example",
  # Generated by the build job after the link check runs; covered by mkdocs build --strict
  "docs/external/",
  "docs/downloads/knowledge-base-",
  # iso.org answers 403 to GitHub-hosted runners (bot protection); links work from a browser
  '^https://www\.iso\.org/standard/'
]
# Retry for flaky endpoints
retry_wait_time = 2
max_retries = 3
# Cache to reduce rate limits across runs
# lychee always writes the cache to .lycheecache in the working directory
cache = true
# Accept common redirect codes
accept = [200, 206, 301, 302, 429]